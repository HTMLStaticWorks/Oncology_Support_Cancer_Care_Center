<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal Login | Oncura Cancer Care Center</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-top">
                <a href="index.html" class="logo auth-logo" aria-label="Oncura Home">
                    <i class="logo-icon"><i class="fa-solid fa-ribbon"></i></i> <span>Oncura</span>
                </a>
                <button type="button" id="theme-toggle" class="toggle-btn" title="Toggle theme"
                    aria-label="Toggle theme">🌙</button>
            </div>
            <h1>Patient Portal Login</h1>
            <p>Access treatment schedules, care team notes, and medication reminders.</p>
        </div>

        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label>Email Address or Medical Record #</label>
                <input type="text" placeholder="name@example.com or MRN" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember Me
                    </label>
                    <a href="#" class="forgot-password-link">Forgot Password?</a>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-auth">Enter Patient Portal</button>
        </form>

        <div class="divider">OR</div>

        <button class="btn-social btn-google" onclick="window.location.href='dashboard.html'">
            <i class="fa-brands fa-google"></i> Sign In with Hospital Account
        </button>

        <div class="auth-footer" style="margin-top: 25px;">
            New Patient? <a href="register.html">Register for Portal Access</a>
        </div>
        
        <div style="margin-top: 20px; font-size: 0.8rem; color: var(--text-muted);">
            <i class="fa-solid fa-shield-halved" style="color: var(--primary);"></i> HIPAA-Compliant 256-Bit Encrypted Patient Gateway
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
</body>

</html>
