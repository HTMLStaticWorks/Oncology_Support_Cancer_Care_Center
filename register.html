<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Patient Portal Registration | Oncura Cancer Care Center</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">

    <div class="auth-nav-controls">
        <button type="button" id="rtl-toggle" class="toggle-btn" title="Switch Language Direction" aria-label="Switch Language Direction">
            <i class="fa-solid fa-right-left"></i>
        </button>
        <button type="button" id="theme-toggle" class="toggle-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-top">
                <a href="index.html" class="logo auth-logo" aria-label="Oncura Home">
                    <i class="logo-icon"><i class="fa-solid fa-ribbon"></i></i> <span>Oncura</span>
                </a>
            </div>
            <h1>Patient Portal Intake</h1>
            <p>Register to manage cancer care schedules, care notes, and reminders.</p>
        </div>

        <form class="auth-form" id="registerForm">
            <div class="form-group">
                <label>Full Legal Name</label>
                <input type="text" placeholder="First and Last Name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Medical Record Number (Optional if new patient)</label>
                <input type="text" placeholder="e.g. #ONC-12345">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-input-wrapper">
                    <input type="password" placeholder="••••••••" required>
                    <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="password-input-wrapper">
                    <input type="password" placeholder="••••••••" required>
                    <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms" style="font-size: 0.9rem; margin-bottom: 0; font-weight: 400;">
                    I consent to HIPAA privacy practices and terms of electronic care communication.
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-auth">Create Patient Portal Account</button>
        </form>

        <div class="divider">OR</div>

        <button class="btn-social btn-google" onclick="window.location.href='dashboard.html'">
            <i class="fa-brands fa-google"></i> Sign In with Hospital Account
        </button>

        <button class="btn-social btn-apple" onclick="window.location.href='dashboard.html'">
            <i class="fa-brands fa-apple"></i> Sign In with Apple
        </button>

        <div class="auth-footer" style="margin-top: 25px;">
            Already have an account? <a href="login.html">Sign In Here</a>
        </div>

        <div style="margin-top: 20px; font-size: 0.8rem; color: var(--text-muted);">
            <i class="fa-solid fa-shield-halved" style="color: var(--primary);"></i> HIPAA-Compliant 256-Bit Encrypted Patient Gateway
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Patient portal registration successful! Redirecting to secure login...');
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
